<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120d1c">
<title>Ломбард «Последний шанс»</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="h-left">
      <div class="chip day" id="hDay">День 1</div>
      <div class="chip money" id="hMoneyBox">💰 <b id="hMoney">$0</b></div>
      <div class="chip rep">⭐ <b id="hRep">50</b></div>
      <div class="chip left">👥 <b id="hLeft">0</b></div>
    </div>
    <div class="h-right">
      <button class="hb" id="bCat" title="Каталог">📖</button>
      <button class="hb" id="bWanted" title="Ориентировки">🚨</button>
      <button class="hb inv" id="bInv" title="Склад">📦<i id="hInv">0</i></button>
      <button class="hb" id="bSnd" title="Звук">🔊</button>
    </div>
  </header>

  <main id="scene">
    <svg class="bg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1240"/><stop offset=".6" stop-color="#4a2a6e"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
        <linearGradient id="bgWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1f2e"/><stop offset="1" stop-color="#3b2a2a"/></linearGradient>
        <radialGradient id="bgLamp" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
        <filter id="neon" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <rect width="400" height="600" fill="url(#bgWall)"/>
      <!-- окно -->
      <rect x="40" y="70" width="320" height="340" fill="url(#bgSky)"/>
      <circle cx="300" cy="130" r="26" fill="#ffe9c7" opacity=".9"/>
      <circle cx="290" cy="124" r="5" fill="#f2d3a8"/><circle cx="308" cy="140" r="3.5" fill="#f2d3a8"/>
      <g fill="#ffffff" opacity=".7"><circle cx="80" cy="100" r="1"/><circle cx="130" cy="85" r="1.3"/><circle cx="200" cy="110" r="1"/><circle cx="240" cy="90" r=".8"/><circle cx="340" cy="190" r="1"/><circle cx="60" cy="160" r=".9"/></g>
      <g fill="#1b1430">
        <rect x="40" y="250" width="40" height="160"/><rect x="85" y="200" width="34" height="210"/><rect x="122" y="270" width="30" height="140"/>
        <rect x="160" y="170" width="46" height="240"/><rect x="176" y="140" width="14" height="30"/><rect x="212" y="230" width="36" height="180"/>
        <rect x="252" y="190" width="40" height="220"/><rect x="298" y="260" width="30" height="150"/><rect x="330" y="215" width="30" height="195"/>
      </g>
      <g fill="#ffcf6b" opacity=".85">
        <rect x="92" y="215" width="5" height="6"/><rect x="104" y="230" width="5" height="6"/><rect x="92" y="260" width="5" height="6"/><rect x="104" y="300" width="5" height="6"/>
        <rect x="168" y="190" width="6" height="7"/><rect x="186" y="210" width="6" height="7"/><rect x="168" y="250" width="6" height="7"/><rect x="190" y="290" width="6" height="7"/><rect x="176" y="330" width="6" height="7"/>
        <rect x="260" y="205" width="5" height="6"/><rect x="276" y="235" width="5" height="6"/><rect x="260" y="280" width="5" height="6"/><rect x="220" y="250" width="5" height="6"/><rect x="232" y="300" width="5" height="6"/>
        <rect x="338" y="230" width="5" height="6"/><rect x="48" y="270" width="5" height="6"/><rect x="60" y="320" width="5" height="6"/><rect x="306" y="280" width="5" height="6"/>
      </g>
      <g fill="#7af0ff" opacity=".9"><rect x="216" y="236" width="28" height="3"/><rect x="256" y="196" width="32" height="3" fill="#ff4fa3"/></g>
      <!-- рама окна -->
      <g fill="none" stroke="#120d14" stroke-width="10"><rect x="40" y="70" width="320" height="340"/><line x1="200" y1="70" x2="200" y2="410"/><line x1="40" y1="230" x2="360" y2="230"/></g>
      <text x="200" y="168" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="30" fill="#ff3b6b" filter="url(#neon)" opacity=".9" letter-spacing="3">ЛОМБАРД</text>
      <text x="200" y="196" text-anchor="middle" font-family="Arial" font-weight="700" font-size="14" fill="#7af0ff" filter="url(#neon)" opacity=".85" letter-spacing="4">24 / 7</text>
      <!-- полки -->
      <g>
        <rect x="0" y="120" width="34" height="6" fill="#5a3a26"/><rect x="0" y="210" width="34" height="6" fill="#5a3a26"/><rect x="0" y="300" width="34" height="6" fill="#5a3a26"/>
        <rect x="366" y="120" width="34" height="6" fill="#5a3a26"/><rect x="366" y="210" width="34" height="6" fill="#5a3a26"/><rect x="366" y="300" width="34" height="6" fill="#5a3a26"/>
        <rect x="6" y="96" width="22" height="24" rx="3" fill="#3a3a44"/><rect x="9" y="99" width="16" height="13" fill="#5a7a8a"/>
        <circle cx="16" cy="196" r="12" fill="#c9a03a"/><rect x="10" y="276" width="6" height="24" fill="#8a5a2a"/><ellipse cx="13" cy="270" rx="8" ry="10" fill="#b5332e"/>
        <rect x="372" y="98" width="20" height="22" fill="#2f5d8c"/><path d="M375 210 l8 -24 8 24 Z" fill="#c4c4c4"/><rect x="372" y="280" width="22" height="20" rx="4" fill="#7a3d8c"/>
      </g>
      <!-- лампа -->
      <line x1="200" y1="0" x2="200" y2="40" stroke="#111" stroke-width="2"/>
      <path d="M180 40 L220 40 L232 58 L168 58 Z" fill="#2e2e2e"/>
      <ellipse cx="200" cy="58" rx="32" ry="4" fill="#ffd27a"/>
      <path d="M168 58 L0 600 L400 600 L232 58 Z" fill="url(#bgLamp)"/>
    </svg>

    <div class="ticker" id="ticker"></div>
    <div id="person" class="person"></div>

    <div class="counter">
      <svg viewBox="0 0 400 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="ctTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a34"/><stop offset="1" stop-color="#5a3620"/></linearGradient>
          <linearGradient id="ctMat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7a78"/><stop offset="1" stop-color="#1f5654"/></linearGradient>
        </defs>
        <rect x="0" y="0" width="400" height="16" fill="url(#ctTop)"/>
        <rect x="0" y="16" width="400" height="124" fill="#3a2418"/>
        <rect x="60" y="22" width="280" height="110" rx="8" fill="url(#ctMat)" stroke="#173f3e" stroke-width="2"/>
        <g stroke="#ffffff" stroke-opacity=".08">
          <line x1="60" y1="44" x2="340" y2="44"/><line x1="60" y1="66" x2="340" y2="66"/><line x1="60" y1="88" x2="340" y2="88"/><line x1="60" y1="110" x2="340" y2="110"/>
          <line x1="100" y1="22" x2="100" y2="132"/><line x1="140" y1="22" x2="140" y2="132"/><line x1="180" y1="22" x2="180" y2="132"/><line x1="220" y1="22" x2="220" y2="132"/><line x1="260" y1="22" x2="260" y2="132"/><line x1="300" y1="22" x2="300" y2="132"/>
        </g>
        <text x="72" y="38" font-family="Arial" font-weight="700" font-size="9" fill="#ffffff" fill-opacity=".35">⊕ ПОСЛЕДНИЙ ШАНС</text>
      </svg>
      <div id="counterItem"></div>
    </div>
  </main>

  <section id="panel" class="hidden">
    <div class="speech"><b id="spName"></b><p id="spText"></p></div>
    <div id="actions"></div>
  </section>

  <div id="inspect" class="overlay"></div>
  <div id="modal" class="overlay"></div>
  <div id="modal2" class="overlay"></div>
  <div id="mg" class="overlay"></div>
  <div id="title" class="overlay"></div>
  <div id="toasts"></div>
</div>

<script src="js/util.js"></script>
<script src="js/items.js"></script>
<script src="js/characters.js"></script>
<script src="js/minigames.js"></script>
<script src="js/game.js"></script>
</body>
</html>
