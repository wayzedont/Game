<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ломбард «Последний шанс»</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <main id="scene">
    <div id="counterItem"></div>
    <div class="crt"></div>

    <header id="hud">
      <div class="hud-l">
        <div class="h-day"><small>ДЕНЬ</small><b id="hDay">01</b></div>
        <div class="h-q"><small>КЛИЕНТЫ</small><b id="hLeft">0</b></div>
      </div>
      <div class="hud-r">
        <div class="h-money" id="hMoneyBox"><b id="hMoney">$0</b></div>
        <div class="h-rep"><span id="hRep"></span><small id="hRepN">50</small></div>
      </div>
    </header>
    <div class="ticker" id="ticker"></div>
    <div class="h-btns">
      <button class="hb" id="bInv" aria-label="Склад"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/></svg><i id="hInv">0</i></button>
      <button class="hb" id="bPause" aria-label="Меню"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
    <button id="itemHint" class="item-hint">ОСМОТРЕТЬ</button>

    <div id="subs" class="empty"><b id="spName"></b><p id="spText"></p></div>
  </main>

  <section id="actions" class="empty"></section>

  <div id="inspect" class="overlay"></div>
  <div id="modal" class="overlay"></div>
  <div id="modal2" class="overlay"></div>
  <div id="mg" class="overlay"></div>
  <div id="title" class="overlay"></div>
  <div id="toasts"></div>
  <div id="saving">ИГРА СОХРАНЕНА</div>
</div>

<script src="js/lib/three.min.js"></script>
<script src="js/util.js"></script>
<script src="js/ui.js"></script>
<script src="js/items.js"></script>
<script src="js/characters.js"></script>
<script src="js/scene3d.js"></script>
<script src="js/minigames.js"></script>
<script src="js/game.js"></script>
</body>
</html>
